<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Registro de Utilizadores</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-md mx-auto mt-10 p-6">
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="p-6 bg-blue-600 text-white">
                <h1 class="text-xl font-bold">Registro de Utilizador</h1>
                <p class="text-sm opacity-80 mt-1">Regista um novo utilizador no sistema</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for cat, msg in messages %}
                        <div class="mx-6 mt-4 px-4 py-3 rounded-lg text-sm
                            {% if cat == 'sucesso' %}bg-green-100 text-green-700
                            {% else %}bg-red-100 text-red-700{% endif %}">
                            {{ msg }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="/painel/registrar" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ID da Loja (tenant_id) *</label>
                    <input type="number" name="tenant_id" required min="1"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="Ex: 1">
                    <p class="text-xs text-gray-400 mt-1">ID da loja na base de dados</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo *</label>
                    <input type="text" name="nome" required
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="Ex: Manuel Silva">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Telefone (WhatsApp) *</label>
                    <input type="text" name="telefone" required
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="841234567">
                </div>

                <button type="submit"
                        class="w-full py-3 bg-green-600 text-white rounded-lg font-medium hover:bg-green-700 transition">
                    Registar Utilizador
                </button>
            </form>
        </div>
    </div>
</body>
</html>
