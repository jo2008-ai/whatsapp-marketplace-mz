version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace_saas
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret_change_me}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_change_me}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  evolution:
    image: atendai/evolution-api:v2.2.3
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-marketplace_secret_key_2026}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://marketplace:${DB_PASSWORD}@postgres:5432/marketplace_saas
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      LOG_LEVEL: WARN
      DEL_INSTANCE: "false"
      LANGUAGE: pt-BR
      CACHE_LOCAL_ENABLED: "true"
      CACHE_REDIS_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: MarketPlaceMZ
      CONFIG_SESSION_PHONE_NAME: Chrome
      CONFIG_SESSION_PHONE_VERSION: "2.24.12.55"
    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy

  python:
    build: ./python
    ports:
      - "5000:5000"
    environment:
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-marketplace_secret_key_2026}
      EVOLUTION_URL: http://evolution:8080
      PHP_API_URL: http://php:8000/api/mensagem
      TENANT_ID_DEFAULT: "1"
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-8b883a8caf48a698f678bd498b822e51}
    depends_on:
      - evolution

  php:
    build: ./php
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: marketplace_saas
      DB_USERNAME: marketplace
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret_change_me}
      PYTHON_SERVICE_URL: http://python:5000
      EVOLUTION_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-marketplace_secret_key_2026}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-8b883a8caf48a698f678bd498b822e51}
      TYPEBOT_API_URL: http://typebot-viewer:3000
      TYPEBOT_API_KEY: ${TYPEBOT_API_KEY:-typebot_secret_2026}
      APP_KEY: ${APP_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_DRIVER: redis
      CACHE_STORE: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  typebot-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: typebot
      POSTGRES_USER: typebot
      POSTGRES_PASSWORD: ${TYPEBOT_DB_PASSWORD:-typebot_secret_2026}
    volumes:
      - typebot_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typebot"]
      interval: 5s
      timeout: 5s
      retries: 5

  typebot-builder:
    image: baptistejohn/typebot-builder:latest
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://typebot:${TYPEBOT_DB_PASSWORD:-typebot_secret_2026}@typebot-db:5432/typebot
      NEXTAUTH_URL: ${TYPEBOT_BUILDER_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${TYPEBOT_NEXTAUTH_SECRET:-typebot_nextauth_secret_2026}
      ENCRYPTION_PASSWORD: ${TYPEBOT_ENCRYPTION_PASSWORD:-typebot_encryption_2026}
      ADMIN_EMAIL: ${TYPEBOT_ADMIN_EMAIL:-admin@marketplace.mz}
      ADMIN_PASSWORD: ${TYPEBOT_ADMIN_PASSWORD:-admin123}
    depends_on:
      typebot-db:
        condition: service_healthy

  typebot-viewer:
    image: baptistejohn/typebot-viewer:latest
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: postgresql://typebot:${TYPEBOT_DB_PASSWORD:-typebot_secret_2026}@typebot-db:5432/typebot
      TYPEBOT_BUILDER_INTERNAL_URL: http://typebot-builder:3000
      NEXT_PUBLIC_VIEWER_URL: ${TYPEBOT_VIEWER_URL:-http://localhost:3002}
    depends_on:
      typebot-db:
        condition: service_healthy
      typebot-builder:
        condition: service_started

volumes:
  pgdata:
  evolution_data:
  typebot_db_data:
