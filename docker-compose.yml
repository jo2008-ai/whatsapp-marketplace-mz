version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace_saas
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret_change_me}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_change_me}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  waha:
    image: ghcr.io/devlikeapro/waha-core:latest
    ports:
      - "3000:3000"
    environment:
      WAHA_CORE_LOG_LEVEL: info
    volumes:
      - waha_data:/app/.media

  python:
    build: ./python
    ports:
      - "5000:5000"
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-marketplace_secret_key_2026}
      WAHA_URL_1: http://waha:3000
      WAHA_URL_2: http://waha:3000
      WAHA_URL_3: http://waha:3000
      WAHA_URL_4: http://waha:3000
      PHP_API_URL: http://php:8000/api/mensagem
      TENANT_ID_DEFAULT: "1"
    depends_on:
      - waha

  php:
    build: ./php
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: marketplace_saas
      DB_USERNAME: marketplace
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret_change_me}
      PYTHON_SERVICE_URL: http://python:5000
      WAHA_URL_1: http://waha:3000
      WAHA_URL_2: http://waha:3000
      WAHA_URL_3: http://waha:3000
      WAHA_URL_4: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:-marketplace_secret_key_2026}
      APP_KEY: ${APP_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_DRIVER: redis
      CACHE_STORE: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  waha_data:
