services:
  - type: web
    name: marketplace-php
    env: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./php/Dockerfile
    dockerContext: ./php
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: MarketplaceMZ
      - key: APP_ENV
        value: production
      - key: APP_KEY
        value: CHANGE_ME_GENERATE_WITH_php_artisan_key_generate
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://whatsapp-marketplace-mz.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        value: CHANGE_ME_DATABASE_URL_FROM_SUPABASE
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: PYTHON_URL
        value: https://marketplace-python.onrender.com
      - key: EVOLUTION_URL
        value: https://marketplace-evolution.onrender.com
      - key: EVOLUTION_API_KEY
        value: marketplace_secret_key_2026
      - key: EVOLUTION_WEBHOOK_SECRET
        value: 8b883a8caf48a698f678bd498b822e51
      - key: WEBHOOK_SECRET
        value: 8b883a8caf48a698f678bd498b822e51
      - key: ADMIN_API_KEY
        value: 0871@py
      - key: SUPER_ADMIN_EMAIL
        value: admin@marketplace.co.mz

  - type: web
    name: marketplace-python
    env: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./python/Dockerfile
    dockerContext: ./python
    healthCheckPath: /health
    envVars:
      - key: LARAVEL_URL
        value: https://whatsapp-marketplace-mz.onrender.com
      - key: PHP_API_URL
        value: https://whatsapp-marketplace-mz.onrender.com/api/mensagem
      - key: APP_URL
        value: https://whatsapp-marketplace-mz.onrender.com
      - key: EVOLUTION_URL
        value: https://marketplace-evolution.onrender.com
      - key: EVOLUTION_API_KEY
        value: marketplace_secret_key_2026
      - key: ADMIN_API_KEY
        value: 0871@py
      - key: TENANT_ID_DEFAULT
        value: "1"
      - key: WEBHOOK_SECRET
        value: marketplace_secret_key_2026
      - key: PORT
        value: "5000"
      - key: DEBUG
        value: "false"

  - type: web
    name: marketplace-evolution
    env: docker
    region: frankfurt
    plan: free
    image:
      url: atendai/evolution-api:v2.2.3
    disk:
      name: evolution-data
      mountPath: /evolution/instances
      sizeGB: 1
    healthCheckPath: /manager/health
    envVars:
      - key: SERVER_URL
        value: https://marketplace-evolution.onrender.com
      - key: AUTHENTICATION_API_KEY
        value: marketplace_secret_key_2026
      - key: AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES
        value: "true"
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        value: postgresql://neondb_owner:npg_4Hx3VcwatsRY@ep-delicate-flower-as0ryf6z.c-4.eu-central-1.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "false"
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "false"
      - key: DATABASE_SAVE_DATA_CHATS
        value: "false"
      - key: LOG_LEVEL
        value: WARN
      - key: DEL_INSTANCE
        value: "false"
      - key: LANGUAGE
        value: pt-BR
      - key: CACHE_LOCAL_ENABLED
        value: "true"
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: WEBHOOK_GLOBAL_ENABLED
        value: "false"
      - key: WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS
        value: "true"
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: MarketPlaceMZ
      - key: CONFIG_SESSION_PHONE_NAME
        value: Chrome
      - key: CONFIG_SESSION_PHONE_VERSION
        value: "2.24.12.55"
